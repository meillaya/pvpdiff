[workspace]
resolver = "3"
members = [
  "crates/pvpdiff-parse",
  "crates/pvpdiff-core",
  "crates/pvpdiff-hackage",
  "crates/pvpdiff-index",
  "crates/pvpdiff-survey",
  "crates/pvpdiff-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["Meillaya <nathanagbomed@proton.me>"]
repository = "https://github.com/meillaya/pvpdiff"

[workspace.dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
cabalist-parser = "=0.1.2"
clap = { version = "4.6.8", features = ["derive", "env", "wrap_help"] }
directories = "6.0.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-sarif = "0.8.0"
serde_json = "1.0.154"
sha2 = "0.10.9"
tar = "0.4.46"
thiserror = "2.0.21"
url = "2.5.8"

# Development-only dependencies. Kept in the workspace so every crate uses the
# same versions once the test suites grow.
assert_cmd = "2"
httpmock = "0.9.0"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
