name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake:
    name: Nix / linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check

      - name: Development shell
        run: nix develop --impure --command rustc --version

      - name: Build the package
        run: nix build .#default

      - name: Check the packaged CLI
        run: |
          test -x result/bin/pvpdiff
          ./result/bin/pvpdiff --version
          ./result/bin/pvpdiff --help
